<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baum-Profi">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:auto}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Baum-Profi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout wie der Einmaleins-Trainer: eine schmale Spalte, grosse Tasten fuer Daumen. */
:root {
  --bg: #F2F5FB; --grid: #DCE4F2; --surface: #FFFFFF; --ink: #17213B; --muted: #55627F; --line: #C4CFE6;
  --blue: #2F5BEA; --blue-ink: #FFFFFF; --sun: #FFC233; --sun-ink: #3A2A00;
  --good: #0E8F78; --good-bg: #D6F3EB; --bad: #D63E30; --bad-bg: #FFE0DB;
  --c0: #E3E9F5; --c1: #FFB4A8; --c2: #FFE08A; --c3: #A9E4D4; --c4: #4FC3A8; --cell-ink: #17213B;
  --bgimg: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  --bgsize: 24px 24px;
  --display: 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1730; --grid: #1A2548; --surface: #18223F; --ink: #EAF0FF; --muted: #9FADD0; --line: #2D3B66;
    --blue: #7C99FF; --blue-ink: #0B1330; --good: #52D1B3; --good-bg: #123B38; --bad: #FF8B7D; --bad-bg: #4A2323;
    --c0: #26314F; --c1: #A8473B; --c2: #7D6618; --c3: #1F7A68; --c4: #26A07F; --cell-ink: #EAF0FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1730; --grid: #1A2548; --surface: #18223F; --ink: #EAF0FF; --muted: #9FADD0; --line: #2D3B66;
  --blue: #7C99FF; --blue-ink: #0B1330; --good: #52D1B3; --good-bg: #123B38; --bad: #FF8B7D; --bad-bg: #4A2323;
  --c0: #26314F; --c1: #A8473B; --c2: #7D6618; --c3: #1F7A68; --c4: #26A07F; --cell-ink: #EAF0FF;
  color-scheme: dark;
}
:root[data-look="space"] {
  --bg: #0B1030; --grid: #161E4C; --surface: #151C48; --ink: #F1F3FF; --muted: #A9B1DE; --line: #2E3A7A;
  --blue: #8795FF; --blue-ink: #0B1030; --sun: #FFC94A; --sun-ink: #3A2A00;
  --good: #49E0B5; --good-bg: #10404A; --bad: #FF8597; --bad-bg: #4A1E3A;
  --c0: #232C66; --c1: #B04668; --c2: #8E7420; --c3: #1F8C7A; --c4: #2BB58F; --cell-ink: #F1F3FF;
  --bgimg: radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,0.7) 50%, transparent 52%), radial-gradient(1px 1px at 95px 82px, rgba(255,255,255,0.5) 50%, transparent 52%), radial-gradient(2px 2px at 150px 140px, rgba(255,201,74,0.7) 50%, transparent 52%);
  --bgsize: 180px 180px;
  color-scheme: dark;
}
:root[data-look="sloth"] {
  --bg: #DAF1D6; --grid: #BFE3BD; --surface: #FAFFF6; --ink: #14361F; --muted: #3F6A4A; --line: #A8D5A6;
  --blue: #1E7A3C; --blue-ink: #FFFFFF; --sun: #FFB020; --sun-ink: #3A2400;
  --good: #137A3A; --good-bg: #CFF0D2; --bad: #D1384A; --bad-bg: #FFE0DD;
  --c0: #CFE8CC; --c1: #FFB3A0; --c2: #FFE08A; --c3: #A8E0A0; --c4: #3DB35A; --cell-ink: #14361F;
  --bgimg: radial-gradient(circle at 30px 30px, #FF8FB3 3px, transparent 3.5px), repeating-linear-gradient(120deg, transparent 0 26px, var(--grid) 26px 30px);
  --bgsize: 90px 90px, auto;
  color-scheme: light;
}
:root[data-look="football"] {
  --bg: #D9F0DE; --grid: #C9E8D0; --surface: #FFFFFF; --ink: #0F2A1B; --muted: #47624F; --line: #A5CBB0;
  --blue: #0E7A3E; --blue-ink: #FFFFFF; --sun: #FFD21F; --sun-ink: #3A2A00;
  --good: #0B8A44; --good-bg: #D4F3DF; --bad: #D32F2F; --bad-bg: #FFE0DC;
  --c0: #D8EADC; --c1: #FFB4A8; --c2: #FFE08A; --c3: #A9E4B8; --c4: #3FB86A; --cell-ink: #0F2A1B;
  --bgimg: repeating-linear-gradient(90deg, var(--grid) 0 56px, transparent 56px 112px);
  --bgsize: auto;
  color-scheme: light;
}
:root[data-look="kiwi"] {
  --bg: #EAF5C9; --grid: #D6E8A4; --surface: #FBFFEE; --ink: #26340F; --muted: #55672F; --line: #BFD78A;
  --blue: #3F7F0A; --blue-ink: #FFFFFF; --sun: #FFC93C; --sun-ink: #3A2A00;
  --good: #1B7F37; --good-bg: #D8F2CC; --bad: #C23B2B; --bad-bg: #FFE0D4;
  --c0: #DDEBB9; --c1: #FFB59C; --c2: #FFE08A; --c3: #BFE5A8; --c4: #62B83C; --cell-ink: #26340F;
  --bgimg: radial-gradient(circle at 12px 12px, var(--grid) 3px, transparent 3.5px);
  --bgsize: 36px 36px;
  color-scheme: light;
}
:root[data-look="bear"] {
  --bg: #F6E7C1; --grid: #EBD5A0; --surface: #FFFBF0; --ink: #3B2416; --muted: #6E5538; --line: #DFC384;
  --blue: #8A4B1F; --blue-ink: #FFFFFF; --sun: #FFB627; --sun-ink: #3A2A00;
  --good: #2A7A2E; --good-bg: #DDF0D2; --bad: #C0392B; --bad-bg: #FFE0D4;
  --c0: #F0E1BC; --c1: #FFB59C; --c2: #FFE08A; --c3: #BFE5A8; --c4: #6DBE6A; --cell-ink: #3B2416;
  --bgimg: radial-gradient(circle at 20px 20px, var(--grid) 6px, transparent 6.5px);
  --bgsize: 60px 60px;
  color-scheme: light;
}
:root[data-look="unicorn"] {
  --bg: #FCEAF4; --grid: #F6D3E6; --surface: #FFF8FC; --ink: #3B1F4A; --muted: #75558A; --line: #EBC3DC;
  --blue: #B03A8E; --blue-ink: #FFFFFF; --sun: #FFC857; --sun-ink: #3A2A00;
  --good: #1F8A6B; --good-bg: #D6F3EA; --bad: #C8325A; --bad-bg: #FFDDE6;
  --c0: #F3DDEB; --c1: #FFB3C1; --c2: #FFE29A; --c3: #BDE8D6; --c4: #63C7A6; --cell-ink: #3B1F4A;
  --bgimg: radial-gradient(circle at 10px 10px, var(--grid) 3px, transparent 3.5px), radial-gradient(circle at 40px 34px, #D9C6F5 2.5px, transparent 3px);
  --bgsize: 56px 56px;
  color-scheme: light;
}
:root[data-look="mermaid"] {
  --bg: #DFF6F5; --grid: #BFE8E6; --surface: #F7FFFE; --ink: #0F3B45; --muted: #3F6C77; --line: #A9DAD8;
  --blue: #0B7F8E; --blue-ink: #FFFFFF; --sun: #FFC857; --sun-ink: #3A2A00;
  --good: #12806A; --good-bg: #D3F3E8; --bad: #C93C4B; --bad-bg: #FFE1E0;
  --c0: #D0EEEC; --c1: #FFB5B0; --c2: #FFE29A; --c3: #A9E6D6; --c4: #3FBFA6; --cell-ink: #0F3B45;
  --bgimg: radial-gradient(circle at 16px 16px, transparent 5px, var(--grid) 5.5px 7px, transparent 7.5px);
  --bgsize: 64px 64px;
  color-scheme: light;
}
:root[data-look="butterfly"] {
  --bg: #EEE7FB; --grid: #DDD0F5; --surface: #FBF9FF; --ink: #2D1B55; --muted: #66558F; --line: #CDBDF0;
  --blue: #6A3FCF; --blue-ink: #FFFFFF; --sun: #FFD23F; --sun-ink: #3A2A00;
  --good: #1F8A5B; --good-bg: #D9F2E4; --bad: #C8325A; --bad-bg: #FFDDE6;
  --c0: #E3D9F6; --c1: #FFB3C1; --c2: #FFE29A; --c3: #BDE8D0; --c4: #5FC08F; --cell-ink: #2D1B55;
  --bgimg: radial-gradient(circle at 18px 18px, var(--grid) 5px, transparent 5.5px), radial-gradient(circle at 54px 54px, #FFE58A 3px, transparent 3.5px);
  --bgsize: 72px 72px;
  color-scheme: light;
}
:root[data-look="cat"] {
  --bg: #FFF0B3; --grid: #F7DE80; --surface: #FFFCEB; --ink: #4A3000; --muted: #7B6120; --line: #EACF70;
  --blue: #B5560E; --blue-ink: #FFFFFF; --sun: #FF9F43; --sun-ink: #3A2000;
  --good: #2E7D32; --good-bg: #DDF0D2; --bad: #C0392B; --bad-bg: #FFE0D4;
  --c0: #F6E7A6; --c1: #FFB59C; --c2: #FFD98A; --c3: #BFE5A8; --c4: #6DBE6A; --cell-ink: #4A3000;
  --bgimg: radial-gradient(circle at 14px 14px, var(--grid) 4px, transparent 4.5px), radial-gradient(circle at 26px 8px, var(--grid) 2.5px, transparent 3px);
  --bgsize: 44px 44px;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg); background-image: var(--bgimg); background-size: var(--bgsize);
  color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 32px; min-height: 100%;
}
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.app { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
section { display: flex; flex-direction: column; gap: 20px; }

h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.1; text-wrap: balance; }
h1 { font-size: 2.3rem; font-weight: 700; }
h1 span { background: linear-gradient(transparent 62%, var(--sun) 62%); padding-inline: 2px; }
h2 { font-size: 1.5rem; font-weight: 600; }
h3 { font-size: 1.35rem; font-weight: 600; }
.lead { margin: 0; color: var(--muted); font-weight: 700; }
.label { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 16px; }

.players { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.player { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.player[aria-pressed="true"] { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue); }
.player b { font-family: var(--display); font-size: 1.25rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player small { font-weight: 800; color: var(--muted); }
.player small i { color: #E5A100; font-style: normal; }
.name-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.name-row label { font-weight: 800; color: var(--muted); font-size: 0.9rem; }
.name-row input { flex: 1; min-width: 0; background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-width: 48px; height: 48px; padding-inline: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-family: var(--display); font-weight: 600; font-size: 1.2rem; }
.chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.chip.wide { font-family: var(--body); font-weight: 800; font-size: 0.95rem; }
.hint { margin: 8px 0 0; color: var(--bad); font-weight: 700; font-size: 0.9rem; min-height: 1.3em; }

.btn { border: 0; border-radius: 14px; padding: 14px 18px; font-family: var(--display); font-weight: 600; font-size: 1.25rem; background: var(--blue); color: var(--blue-ink); box-shadow: 0 4px 0 rgba(0,0,0,0.22); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.22); }
.btn.sun { background: var(--sun); color: var(--sun-ink); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); box-shadow: none; }
.btn.full { width: 100%; text-align: left; }
.btn small { display: block; font-family: var(--body); font-weight: 700; font-size: 0.82rem; opacity: 0.85; }
.modes { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-top: 4px; }
.modes .btn { text-align: left; }
.link { background: none; border: 0; padding: 8px 0; color: var(--blue); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.who { font-weight: 800; color: var(--muted); }
.dots { display: flex; gap: 5px; }
.dots i { flex: 1; height: 10px; border-radius: 5px; background: var(--c0); border: 1px solid var(--line); }
.dots i.ok { background: var(--good); border-color: var(--good); }
.dots i.no { background: var(--bad); border-color: var(--bad); }
.dots i.now { background: var(--sun); border-color: var(--sun); }
.timer { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 14px; border-radius: 7px; background: var(--c0); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--sun); transform-origin: left; }
.bar.green i { background: var(--good); }
.timer b { font-family: var(--display); font-size: 1.3rem; font-variant-numeric: tabular-nums; min-width: 2.4ch; text-align: right; }
.score { font-weight: 800; color: var(--muted); }
.score b { color: var(--good); font-family: var(--display); font-size: 1.2rem; }

.card { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 18px 16px 16px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
.card.flash-ok { border-color: var(--good); background: var(--good-bg); }
.card.flash-no { border-color: var(--bad); background: var(--bad-bg); animation: shake 0.3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.qtext { font-family: var(--display); font-weight: 600; font-size: 1.4rem; line-height: 1.2; text-wrap: balance; }
.art { background: #F4F9EC; border: 2px solid #D3E4BE; border-radius: 16px; aspect-ratio: 1; padding: 6px; }
.art svg { width: 100%; height: 100%; display: block; }
#qimg { width: min(230px, 62vw); margin-inline: auto; }
.fb { min-height: 1.4em; font-weight: 800; font-size: 1.1rem; }
.fb.good { color: var(--good); }
.fb.bad { color: var(--bad); }
.explain { margin: 0; text-align: left; font-weight: 700; background: var(--surface); border: 2px dashed var(--line); border-radius: 12px; padding: 10px 12px; color: var(--ink); }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts.one { grid-template-columns: 1fr; }
.opt { min-height: 62px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-family: var(--body); font-weight: 800; font-size: 1.08rem; line-height: 1.25; padding: 10px 12px; box-shadow: 0 3px 0 var(--line); }
.opt:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt.pic { padding: 6px; background: #F4F9EC; border-color: #D3E4BE; }
.opt.pic svg { width: 100%; aspect-ratio: 1; display: block; }
.opt.right { background: var(--good-bg); border-color: var(--good); box-shadow: 0 0 0 3px var(--good); color: var(--ink); }
.opt.wrongpick { background: var(--bad-bg); border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad); color: var(--ink); }
.opt.dim { opacity: 0.45; }
.opts[data-locked="true"] .opt { pointer-events: none; }

.stars { font-size: 3rem; letter-spacing: 6px; text-align: center; line-height: 1; color: var(--c0); }
.stars i { font-style: normal; }
.stars i.on { color: #F5B100; }
.big { font-family: var(--display); font-size: 1.6rem; font-weight: 600; text-align: center; margin: 0; }
.redo { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.redo li { background: var(--bad-bg); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-weight: 800; }
.actions { display: grid; gap: 12px; }

/* Steckbriefe */
.sb { display: flex; flex-direction: column; gap: 12px; }
.sb-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pill { font-size: 0.8rem; font-weight: 800; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.arts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.art.big { aspect-ratio: 1; max-width: 360px; width: 100%; margin-inline: auto; }
.facts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.facts li { line-height: 1.35; }
.facts b { font-family: var(--display); font-weight: 600; }

.rw-next { margin: 0; font-weight: 800; color: var(--muted); }
.rw-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; margin-top: 12px; }
.rw-tile { border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; text-align: left; background: var(--surface); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rw-tile b { font-family: var(--display); font-size: 0.95rem; font-weight: 600; overflow-wrap: anywhere; }
.rw-tile small { font-weight: 800; color: var(--muted); }
.rw-tile.on { background: var(--good-bg); border-color: var(--good); }
.rw-tile:disabled { opacity: 0.65; cursor: default; }
#reward { position: fixed; inset: 0; z-index: 60; background: rgba(8, 12, 30, 0.62); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.rw-card { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 18px 16px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
.rw-card .label { margin: 0; }
.stage { position: relative; width: 100%; max-width: 300px; aspect-ratio: 1 / 1; margin-inline: auto; border-radius: 16px; overflow: hidden; }
.sc { position: absolute; inset: 0; overflow: hidden; }
.sc .actor { position: absolute; left: 27%; bottom: 12%; width: 46%; aspect-ratio: 1; }
.sc .mimg, .sc .mimg svg { width: 100%; height: 100%; display: block; overflow: visible; }
.sc-dance { background: linear-gradient(160deg, #2a1456, #6b2b8f 60%, #c2438f); }
.sc-dance .lt { position: absolute; width: 60%; aspect-ratio: 1; border-radius: 50%; filter: blur(22px); opacity: 0.45; }
.sc-dance .lt1 { left: -15%; top: -10%; background: #ff5ea8; }
.sc-dance .lt2 { right: -18%; top: 5%; background: #3fd9ff; }
.sc-dance .lt3 { left: 20%; bottom: -25%; background: #ffd23f; }
.sc-dance .disco { position: absolute; left: 50%; top: -8%; width: 24%; aspect-ratio: 1; margin-left: -12%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #b9c3ff 40%, #6c78c9 75%); box-shadow: 0 0 24px rgba(255, 255, 255, 0.6); transform-origin: 50% -60%; }
.sc-dance .hat { position: absolute; left: 50%; top: -24%; width: 44%; margin-left: -22%; z-index: 2; }
.sc-rocket { background: radial-gradient(1.5px 1.5px at 20px 30px, #fff 50%, transparent 52%), radial-gradient(1px 1px at 90px 80px, #fff 50%, transparent 52%), radial-gradient(2px 2px at 160px 140px, #ffd23f 50%, transparent 52%), linear-gradient(#0b1030, #3a2a7a); background-size: 180px 180px, 180px 180px, 180px 180px, auto; }
.sc-rocket .rk { position: absolute; left: 50%; top: 14%; width: 34%; aspect-ratio: 1 / 2; margin-left: -17%; }
.sc-rocket .rk .body { width: 100%; height: 100%; display: block; overflow: visible; }
.sc-rocket .fl { position: absolute; left: 50%; top: 96%; width: 46%; height: 34%; margin-left: -23%; transform-origin: 50% 0; }
.sc-rocket .win { position: absolute; left: 50%; top: 22%; width: 54%; aspect-ratio: 1; margin-left: -27%; border-radius: 50%; overflow: hidden; background: #8fd3ff; border: 4px solid #fff; }
.sc-rocket .win .mimg { position: absolute; width: 150%; height: 150%; left: -25%; top: -18%; }
.sc-rocket .sk { position: absolute; top: -30%; width: 2px; height: 26%; background: rgba(255, 255, 255, 0.7); border-radius: 2px; }

<script>

    }
    show('play');
    coach('coach-play', 'idle', mode === 'test' ? 'Wie in der Probe: 15 Fragen, ' + P().name + '!' : mode === 'blitz' ? 'Gib Gas, ' + P().name + '!' : "Los geht's, " + P().name + '!');
    next();
  }

  function stopTimers() {
    if (S) { if (S.tick) clearInterval(S.tick); if (S.to) clearTimeout(S.to); S.tick = null; S.to = null; }
  }

  function updateTimer() {
    if (!S || S.mode !== 'blitz') return;
    var left = Math.max(0, S.end - Date.now());
    $('#secs').textContent = String(Math.ceil(left / 1000));
    if (left <= 10000 && left > 0 && !S.warned) { S.warned = true; coach('coach-play', 'idle', 'Noch 10 Sekunden!'); }
    $('#barfill').style.transform = 'scaleX(' + (left / 60000) + ')';
    if (left <= 0) finish();
  }

  function renderDots() {
    var d = $('#dots'), n = total();
    d.innerHTML = '';
    for (var i = 0; i < n; i++) {
      var e = document.createElement('i');
      if (i < S.log.length) e.className = S.log[i] ? 'ok' : 'no';
      else if (i === S.log.length) e.className = 'now';
      d.appendChild(e);
    }
  }

  function pick() {
    var p = P();
    if (S.mode === 'practice' && S.retry.length && S.retry[0].due <= S.asked && S.retry[0].id !== S.last) return S.retry.shift().id;
    var cats = S.plan ? [S.plan[S.asked % S.plan.length]] : S.cats;
    var inCat = BANK.filter(function (b) { return cats.indexOf(b.cat) >= 0 && b.id !== S.last; });
    var pool = inCat.filter(function (b) { return !S.used[b.id]; });
    if (!pool.length) pool = inCat;
    var tot = 0, ws = pool.map(function (b) { var f = p.facts[b.id], w = f ? WEIGHT[f.box] : WEIGHT[0]; tot += w; return w; });
    var r = Math.random() * tot;
    for (var i = 0; i < pool.length; i++) { r -= ws[i]; if (r <= 0) return pool[i].id; }
    return pool[pool.length - 1].id;
  }

  function next() {
    if (!S) return;
    if (S.to) { clearTimeout(S.to); S.to = null; }
    if (S.mode !== 'blitz' && S.asked >= total()) { finish(); return; }
    var id = pick(), q = BY_ID[id].make();
    S.used[id] = true;
    S.cur = { id: id, q: q };
    S.last = id;
    S.asked++;
    S.locked = false;
    $('#qtext').textContent = q.text;
    var qi = $('#qimg');
    qi.hidden = !q.img;
    qi.innerHTML = q.img || '';
    var box = $('#opts'), long = q.opts.some(function (o) { return o.t.length > 18; });
    box.className = 'opts' + (q.pics ? ' pics' : long ? ' one' : '');
    box.setAttribute('data-locked', 'false');
    box.innerHTML = '';
    q.opts.forEach(function (o, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt' + (q.pics ? ' pic' : '');
      if (q.pics) { b.innerHTML = o.img; b.setAttribute('aria-label', 'Bild ' + (i + 1)); }
      else b.textContent = o.t;
      b.addEventListener('click', function () { choose(i); });
      box.appendChild(b);
    });
    $('#card').className = 'card';
    $('#fb').textContent = ''; $('#fb').className = 'fb';
    $('#explain').hidden = true;
    $('#next').hidden = true;
    if (S.mode !== 'blitz') renderDots();
  }

  function choose(i) {
    if (!S || S.locked || !S.cur || !S.cur.q.opts[i]) return;
    var q = S.cur.q, id = S.cur.id, p = P(), ok = !!q.opts[i].ok;
    var f = p.facts[id] || { box: 0, seen: 0, right: 0 }, was = f.box;
    f.seen++;
    if (ok) { f.right++; f.box = Math.min(3, f.box + 1); } else f.box = 0;
    p.facts[id] = f;
    var mastered = ok && was < 3 && f.box === 3;
    S.log.push(ok);
    if (ok) S.right++;
    else { S.wrong.push(id); if (S.mode === 'practice') S.retry.push({ id: id, due: S.asked + 3 }); }
    save();
    S.locked = true;
    $('#opts').setAttribute('data-locked', 'true');
    var btns = $('#opts').children;
    q.opts.forEach(function (o, j) {
      if (o.ok) btns[j].classList.add('right');
      else if (j === i) btns[j].classList.add('wrongpick');
      else btns[j].classList.add('dim');
    });
    react(ok, mastered);
    var fb = $('#fb');
    if (S.mode === 'blitz') {
      if (ok) { $('#blitzscore').textContent = String(S.right); fb.className = 'fb good'; fb.textContent = 'Richtig!'; }
      else { fb.className = 'fb bad'; fb.textContent = 'Richtig ist: ' + q.ans; }
      $('#card').className = 'card ' + (ok ? 'flash-ok' : 'flash-no');
      S.to = setTimeout(function () { if (S && S.mode === 'blitz') next(); }, ok ? 450 : 1400);
      return;
    }
    renderDots();
    $('#explain').textContent = q.explain;
    $('#explain').hidden = false;
    $('#next').hidden = false;
    if (ok) {
      $('#card').className = 'card flash-ok';
      fb.className = 'fb good'; fb.textContent = 'Richtig!';
      S.to = setTimeout(next, 2200);
    } else {
      $('#card').className = 'card flash-no';
      fb.className = 'fb bad'; fb.textContent = 'Richtig ist: ' + q.ans;
    }
  }

  function finish() {
    if (!S) return;
    stopTimers();
    var p = P(), stars, title, score, sub, n = S.right;
    var uniq = S.wrong.filter(function (k, i) { return S.wrong.indexOf(k) === i; });
    if (S.mode === 'practice') {
      stars = n >= 9 ? 3 : n >= 7 ? 2 : n >= 5 ? 1 : 0;
      title = n >= 9 ? 'Super gemacht!' : n >= 7 ? 'Richtig gut!' : n >= 5 ? 'Guter Anfang!' : 'Weiter üben lohnt sich!';
      score = n + ' von 10 richtig';
      sub = stars ? 'Du bekommst ' + stars + (stars === 1 ? ' Stern.' : ' Sterne.') : 'Diesmal gibt es keinen Stern. Versuch es nochmal.';
    } else if (S.mode === 'test') {
      stars = n >= 14 ? 3 : n >= 12 ? 2 : n >= 9 ? 1 : 0;
      title = n >= 14 ? 'Du bist bereit für die Probe!' : n >= 11 ? 'Fast schon Baum-Profi!' : 'Noch ein bisschen üben!';
      score = n + ' von 15 richtig';
      sub = (stars ? stars + (stars === 1 ? ' Stern. ' : ' Sterne. ') : '') + (uniq.length ? 'Schau dir unten an, was noch nicht klappt.' : 'Alles richtig!');
    } else {
      stars = n >= 15 ? 3 : n >= 10 ? 2 : n >= 6 ? 1 : 0;
      var newBest = n > p.best;
      if (newBest) p.best = n;
      title = newBest && n > 0 ? 'Neuer Rekord!' : 'Zeit ist um!';
      score = n + ' richtig in 60 Sekunden';
      sub = (stars ? stars + (stars === 1 ? ' Stern. ' : ' Sterne. ') : '') + 'Dein Rekord: ' + p.best;
    }
    p.stars += stars;
    save();
    $('#r-title').textContent = title.replace(/!$/, ', ' + p.name + '!');
    var st = $('#r-stars');
    st.innerHTML = '';
    for (var i = 0; i < 3; i++) { var e = document.createElement('i'); e.textContent = '★'; if (i < stars) { e.className = 'on'; e.style.setProperty('--i', i); } st.appendChild(e); }
    st.setAttribute('aria-label', stars + ' von 3 Sternen');
    $('#r-score').textContent = score;
    $('#r-sub').textContent = sub;
    var ul = $('#r-redo');
    ul.innerHTML = '';
    uniq.slice(0, 12).forEach(function (id) {
      var li = document.createElement('li'), b = BY_ID[id], q = b.make();
      li.textContent = q.short;
      ul.appendChild(li);
    });
    $('#r-redo-box').hidden = uniq.length === 0;
    var mode = S.mode;
    $('#again').onclick = function () { start(mode); };
    S.cur = null;
    show('result');
    celebrate(stars);
    afterRound();
  }

  /* ---------- Steckbriefe ---------- */
  var cardTab = 'laub';
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function treeSure(k) {
    var p = P(), all = 0, sure = 0;
    BANK.forEach(function (b) { if (b.id.split(':')[1] === k) { all++; var f = p.facts[b.id]; if (f && f.box === 3) sure++; } });
    return [sure, all];
  }
  function renderCards() {
    var tabs = $('#c-tabs');
    tabs.innerHTML = '';
    [['laub', 'Laubbäume'], ['nadel', 'Nadelbäume'], ['wald', 'Baum & Wald']].forEach(function (t) {
      var b = el('button', 'chip wide', t[1]);
      b.type = 'button';
      b.setAttribute('aria-pressed', cardTab === t[0] ? 'true' : 'false');
      b.addEventListener('click', function () { cardTab = t[0]; renderCards(); });
      tabs.appendChild(b);
    });
    var box = $('#c-list');
    box.innerHTML = '';
    $('#c-who').textContent = P().name;
    if (cardTab === 'wald') {
      var c1 = el('div', 'panel sb');
      c1.appendChild(el('h3', null, 'Teile des Baumes'));
      var a1 = el('div', 'art big'); a1.innerHTML = ART.parts(null, true); c1.appendChild(a1);
      var u1 = el('ul', 'facts');
      Object.keys(PARTS).forEach(function (k) { var li = el('li'); li.appendChild(el('b', null, PARTS[k] + ': ')); li.appendChild(document.createTextNode(PART_TIP[k])); u1.appendChild(li); });
      var li0 = el('li'); li0.appendChild(el('b', null, 'Rinde: ')); li0.appendChild(document.createTextNode('schützt den Stamm wie eine Haut.')); u1.appendChild(li0);
      c1.appendChild(u1); box.appendChild(c1);
      var c2 = el('div', 'panel sb');
      c2.appendChild(el('h3', null, 'Stockwerke des Waldes'));
      var a2 = el('div', 'art big'); a2.innerHTML = ART.forest(null, true); c2.appendChild(a2);
      var u2 = el('ul', 'facts');
      ['baum', 'strauch', 'kraut', 'moos', 'wurzel'].forEach(function (k) { var li = el('li'); li.appendChild(el('b', null, ART.LAYER_NAMES[k] + ': ')); li.appendChild(document.createTextNode(LAYER_TIP[k])); u2.appendChild(li); });
      c2.appendChild(u2); box.appendChild(c2);
      var c3 = el('div', 'panel sb');
      c3.appendChild(el('h3', null, 'Gut zu wissen'));
      var row = el('div', 'arts'), a3 = el('div', 'art'); a3.innerHTML = ART.rings(5); row.appendChild(a3); c3.appendChild(row);
      var u3 = el('ul', 'facts');
      [['Jahresringe', 'Jedes Jahr wächst ein Ring. Ringe zählen = Alter des Baumes. Diese Scheibe: 5 Jahre.'],
       ['Laubbaum', 'breite, flache Blätter. Im Herbst fallen sie ab.'],
       ['Nadelbaum', 'Nadeln, meist immergrün. Ausnahme: die Lärche.'],
       ['Mischwald', 'Laubbäume und Nadelbäume zusammen.'],
       ['Baum oder Strauch?', 'Baum: ein dicker Stamm. Strauch: viele dünne Stämmchen von unten.']].forEach(function (x) { var li = el('li'); li.appendChild(el('b', null, x[0] + ': ')); li.appendChild(document.createTextNode(x[1])); u3.appendChild(li); });
      c3.appendChild(u3); box.appendChild(c3);
      return;
    }
    (cardTab === 'laub' ? LAUB : NADEL).forEach(function (k) {
      var t = T[k], c = el('div', 'panel sb'), head = el('div', 'sb-head'), ss = treeSure(k);
      head.appendChild(el('h3', null, t.n));
      head.appendChild(el('span', 'pill', ss[0] + ' von ' + ss[1] + ' sicher'));
      c.appendChild(head);
      var row = el('div', 'arts'), a = el('div', 'art');
      a.innerHTML = t.typ === 'laub' ? ART.leaf(k) : ART.needles(k);
      row.appendChild(a);
      if (FRUIT.indexOf(k) >= 0 || ['fichte', 'tanne', 'kiefer'].indexOf(k) >= 0) {
        var b2 = el('div', 'art'); b2.innerHTML = t.typ === 'laub' ? ART.fruit(k) : ART.cone(k); row.appendChild(b2);
      }
      c.appendChild(row);
      var u = el('ul', 'facts');
      [[t.typ === 'laub' ? 'Blatt' : 'Nadeln', t.blatt], [t.typ === 'laub' ? 'Frucht' : 'Zapfen', t.frucht], ['Rinde', t.rinde], ['Merke', t.merke]].forEach(function (x) {
        var li = el('li'); li.appendChild(el('b', null, x[0] + ': ')); li.appendChild(document.createTextNode(x[1])); u.appendChild(li);
      });
      c.appendChild(u);
      box.appendChild(c);
    });
  }

  /* ---------- Belohnungen ---------- */
  var REWARDS = [
    { at: 50,  id: 'dance',  name: 'Tanzparty',          cap: function (n) { return n + ' schmeißt eine Tanzparty, weil das Lernen so gut klappt!'; } },
    { at: 100, id: 'rocket', name: 'Raketenstart',       cap: function (n) { return 'Start frei! ' + n + ' fliegt mit 100 Sternen zum Mond.'; } },
    { at: 150, id: 'juggle', name: 'Kastanien-Jongleur', cap: function (n) { return n + ' jongliert mit Waldfrüchten. Pass auf, dass keine runterfällt!'; } },
    { at: 200, id: 'hero',   name: 'Super-Förster',      cap: function (n) { return 'Hier kommt ' + n + ', der Super-Förster!'; } },
    { at: 300, id: 'pizza',  name: 'Pizza-Regen',        cap: function (n) { return 'Es regnet Pizza! ' + n + ' hat sich 300 Sterne verdient.'; } }
  ];

  /* ---------- Verdrahtung ---------- */
  function home() { stopTimers(); S = null; renderHome(); show('home'); }
  $('#go-practice').addEventListener('click', function () { start('practice'); });
  $('#go-blitz').addEventListener('click', function () { start('blitz'); });
  $('#go-test').addEventListener('click', function () { start('test'); });
  $('#go-cards').addEventListener('click', function () { renderCards(); show('cards'); });
  $('#c-back').addEventListener('click', home);
  $('#c-back2').addEventListener('click', home);
  $('#r-home').addEventListener('click', home);
  $('#quit').addEventListener('click', home);
  $('#next').addEventListener('click', next);
  $('#rw-close').addEventListener('click', closeReward);
  $('#look-toggle').addEventListener('click', function () { lookOpen = !lookOpen; renderLooks(); });
  $('#snd').addEventListener('click', function () { D.sound = !D.sound; save(); renderLooks(); SND.ok(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('#reward').hidden) { closeReward(); return; }
    if (view !== 'play' || !S) return;
    if (e.key >= '1' && e.key <= '4') { choose(+e.key - 1); e.preventDefault(); }
    else if (e.key === 'Enter' && S.locked && !$('#next').hidden) { next(); e.preventDefault(); }
  });

  renderHome();
  show('home');
})();
</script>
</body>
</html>
